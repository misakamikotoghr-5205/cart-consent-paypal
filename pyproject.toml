[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-consent-paypal"
version = "1.0.0"
description = "Exact basket approval and change invalidation for AI shopping proposals"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cart-consent = "cart_consent.__main__:main"

[tool.setuptools.packages.find]
include = ["cart_consent*"]
